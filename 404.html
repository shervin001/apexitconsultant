<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Apex IT Consultant</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to Apex IT Consultant." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#050810" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 6 58 54H44.8L32 29.4 19.2 54H6Z' fill='url(%23g)'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <!-- Root-absolute: 404 pages are served at whatever missing URL was
       requested, so a relative path would resolve against that path. -->
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <canvas id="webgl" aria-hidden="true"></canvas>

  <main class="page-404" style="position: relative; z-index: 1;">
    <div class="glass-card">
      <p class="code-404">404</p>
      <h1>This page drifted out of orbit</h1>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="/" class="btn btn-primary">Back to Home</a>
    </div>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    // Small standalone 3D accent for the 404 page: a lone low-poly
    // planet with a ring, drifting out of orbit. Same performance and
    // fallback rules as the main scene, scaled down.
    import * as THREE from 'three';

    const canvas = document.getElementById('webgl');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function webglAvailable() {
      try {
        const test = document.createElement('canvas');
        return !!(window.WebGLRenderingContext &&
          (test.getContext('webgl2') || test.getContext('webgl')));
      } catch (e) {
        return false;
      }
    }

    if (!canvas || !webglAvailable()) {
      if (canvas) canvas.remove();
    } else {
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 60);
      camera.position.z = 10;

      scene.add(new THREE.AmbientLight(0x2a3c61, 1.4));
      const sun = new THREE.DirectionalLight(0xcfe0ff, 2.6);
      sun.position.set(5, 4, 8);
      scene.add(sun);

      // Displaced low-poly planet.
      const group = new THREE.Group();
      const R = 2.6;
      const geo = new THREE.IcosahedronGeometry(R, 3);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i).normalize();
        const n = Math.sin(v.x * 5.1) * Math.sin(v.y * 4.3 + 2.0) * Math.sin(v.z * 5.7 + 4.0);
        const len = R * (1 + n * 0.09);
        pos.setXYZ(i, v.x * len, v.y * len, v.z * len);
      }
      geo.computeVertexNormals();
      group.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        color: 0x1e6274, emissive: 0x0a2e3c, emissiveIntensity: 0.35,
        flatShading: true, roughness: 0.85, metalness: 0.12,
      })));

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(R * 1.5, R * 2.1, 72),
        new THREE.MeshBasicMaterial({
          color: 0xe8c15a, side: THREE.DoubleSide, transparent: true,
          opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false,
        })
      );
      ring.rotation.x = -1.2;
      group.add(ring);

      group.position.set(4.5, 1.2, -2);
      group.rotation.z = 0.2;
      scene.add(group);

      // A few stars behind everything.
      const starGeo = new THREE.BufferGeometry();
      const starArr = new Float32Array(160 * 3);
      for (let i = 0; i < 160; i++) {
        starArr[i * 3 + 0] = (Math.random() * 2 - 1) * 30;
        starArr[i * 3 + 1] = (Math.random() * 2 - 1) * 18;
        starArr[i * 3 + 2] = -8 - Math.random() * 20;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starArr, 3));
      scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
        color: 0xdbe6ff, size: 0.08, transparent: true, opacity: 0.8,
        blending: THREE.AdditiveBlending, depthWrite: false,
      })));

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (prefersReducedMotion) renderer.render(scene, camera);
      });

      if (prefersReducedMotion) {
        group.rotation.y = 0.8;
        renderer.render(scene, camera);
      } else {
        let rafId = null;
        const animate = () => {
          rafId = requestAnimationFrame(animate);
          group.children[0].rotation.y += 0.0035;
          group.rotation.x = Math.sin(performance.now() * 0.0002) * 0.06;
          renderer.render(scene, camera);
        };
        animate();
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            if (rafId !== null) cancelAnimationFrame(rafId);
            rafId = null;
          } else if (rafId === null) {
            animate();
          }
        });
      }
    }
  </script>
</body>
</html>
